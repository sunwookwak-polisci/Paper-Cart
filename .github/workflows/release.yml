# Push a tag like v0.2.0 to publish a release and update the Homebrew tap.
#
# Setup in the repository that publishes releases:
#   - variable HOMEBREW_TAP: the tap repo, sunwookwak-polisci/homebrew-paper-cart
#   - secret HOMEBREW_TAP_TOKEN: a fine-grained token with contents write on that tap repo
# The tap update runs in the homebrew-tap environment.
# Without them, the release is still created and the tap step is skipped.
# The job runs only in the public repo, so a tag pushed to a private test copy does nothing.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'sunwookwak-polisci/Paper-Cart'
    runs-on: ubuntu-latest
    environment: homebrew-tap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, node24
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3, node24
        with:
          version: "0.13.6"
          python-version: "3.13"
          enable-cache: false

      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $version"
            exit 1
          fi

      - name: Test
        run: uv run pytest

      - name: Build the wheel
        run: uv build --wheel -o dist

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.whl --title "$GITHUB_REF_NAME" --generate-notes

      - name: Write the formula
        run: |
          sha=$(sha256sum dist/*.whl | cut -d' ' -f1)
          uv run python packaging/homebrew/formula.py --repo "$GITHUB_REPOSITORY" --sha256 "$sha" --output dist/paper-cart.rb

      - name: Update the tap
        if: ${{ vars.HOMEBREW_TAP != '' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAP: ${{ vars.HOMEBREW_TAP }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping the tap update"
            exit 0
          fi
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" tap
          mkdir -p tap/Formula
          cp dist/paper-cart.rb tap/Formula/paper-cart.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/paper-cart.rb
          git commit -m "paper-cart $GITHUB_REF_NAME"
          git push
