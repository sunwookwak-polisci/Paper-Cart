<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ heading }} · Paper Cart</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <span class="wordmark">Paper Cart</span>
    </header>
    <main id="content">
      <h1>{{ heading }}</h1>
      <p class="lede">{{ message }}</p>
      {% if failed %}
      <p>Paper Cart is still running.</p>
      <p class="upgrade-follow"><a href="/">Back to Paper Cart</a></p>
      {% else %}
      <p>Your library is saved.</p>
      {% if can_quit %}
      <form class="upgrade-follow" method="post" action="/quit">
        <button type="submit">Quit</button>
      </form>
      {% endif %}
      {% endif %}
    </main>
  </div>
</body>
</html>
