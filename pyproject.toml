[project]
name = "paper-cart"
version = "0.1.0"
description = "Follow journals you choose and keep the papers you mean to read."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "uvicorn>=0.32",
]

[project.scripts]
paper-cart = "paper_cart.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["paper_cart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
